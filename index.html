<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
    <header class="header">
        <img class="header__image" src="./eisenhower-matrix.jpg" alt="main picture">
        <a 
            class="header__link" 
            href="https://goal-life.com/page/method/matrix-eisenhower"
        >
            Want more details?
        </a>
    </header>
    <main class="todo-app">
        <section class="todo-app__add-section">
            <h3 class="todo-app__section-title">Add Item</h3>
            <div class="todo-app__input-wrapper">
                <input 
                    id="new-task" 
                    class="todo-app__input todo-app__input--new" 
                    type="text">
                <button class="todo-app__button todo-app__button--add">Add</button>
            </div>
        </section>
        <section class="todo-app__tasks-section">
            <h3 class="todo-app__section-title">Todo</h3>
            <ul class="todo-app__list" id="incomplete-tasks">
                <li class="todo-app__item">
                    <input 
                        type="checkbox"
                        class="todo-app__checkbox" 
                    >
                    <label class="todo-app__task-label">Pay Bills</label>
                    <input 
                        type="text" 
                        class="todo-app__task-input"
                    >
                    <button class="todo-app__button todo-app__button--edit">Edit</button>
                    <button class="todo-app__button todo-app__button--delete">
                        <img src="./remove.svg" alt="remove icon">
                    </button>
                </li>
                <li class="todo-app__item todo-app__item--editing">
                    <input 
                        type="checkbox"
                        class="todo-app__checkbox" 
                    >
                    <label class="todo-app__task-label">Go Shopping</label>
                    <input 
                        type="text" 
                        value="Go Shopping" 
                        class="todo-app__task-input"
                    >
                    <button class="todo-app__button todo-app__button--save">Save</button>
                    <button class="todo-app__button todo-app__button--delete">
                        <img src="./remove.svg" alt="remove icon">
                    </button>
                </li>
            </ul>
        </section>
        <section class="todo-app__complete-section">
            <h3 class="todo-app__section-title">Completed</h3>
            <ul 
                class="todo-app__list todo-app__list--completed"
                id="completed-tasks"
                class="todo-app__list todo-app__list--completed"
            >
                <li class="todo-app__item todo-app__item--completed">
                    <input 
                        type="checkbox" 
                        checked
                        class="todo-app__checkbox"
                    >
                    <label class="todo-app__task-label">See the Doctor</label>
                    <input 
                        type="text" 
                        class="todo-app__task-input"
                    >
                    <button class="todo-app__button todo-app__button--edit">Edit</button>
                    <button class="todo-app__button todo-app__button--delete">
                        <img src="./remove.svg" alt="remove icon">
                    </button>
                </li>
            </ul>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
