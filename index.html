<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
    <div class="main-img aaa">
        <img class="main-img__picture" src="./eisenhower-matrix.jpg" alt="main picture">
        <a 
            class="main-img__link more_inf" 
            href="https://goal-life.com/page/method/matrix-eisenhower"
        >
            Want more details?
        </a>
    </div>
    <div class="todo-app centered-main-page-element">
        <div id="todo-app__add">
            <label for="new-task">Add Item</label>
            <div class="todo-app__input-wrapper task-row-wrapper">
                <input 
                    id="new-task"
                    class="todo-app__input task" 
                    type="text"
                >
                <button class="todo-app__button todo-app__button--add">Add</button>
            </div>
        </div>
        <h3 class="todo-app__subtitle">Todo</h3>
        <ul id="incomplete-tasks">
            <li class="todo-app__item">
                <input 
                    type="checkbox"
                    class="todo-app__checkbox" 
                >
                <label class="todo-app__task-label task">Pay Bills</label>
                <input 
                    type="text" 
                    class="todo-app__task-input task"
                >
                <button class="todo-app__button todo-app__button--edit edit">Edit</button>
                <button class="todo-app__button todo-app__button--delete delete">
                    <img src="./remove.svg" alt="remove icon">
                </button>
            </li>
            <li class="todo-app__item todo-app__item--editing">
                <input 
                    type="checkbox"
                    class="todo-app__checkbox" 
                >
                <label class="todo-app__task-label task">Go Shopping</label>
                <input 
                    type="text" 
                    value="Go Shopping" 
                    class="todo-app__task-input task"
                >
                <button class="todo-app__button todo-app__button--save edit">Save</button>
                <button class="todo-app__button todo-app__button--delete delete">
                    <img src="./remove.svg" alt="remove icon">
                </button>
            </li>
        </ul>
        <h3 class="todo-app__subtitle">Completed</h3>
        <ul 
            id="completed-tasks"
            class="todo-app__list todo-app__list--completed"
        >
            <li class="todo-app__item todo-app__item--completed">
                <input 
                    type="checkbox" 
                    checked
                    class="todo-app__checkbox"
                >
                <label class="todo-app__checkbox task">See the Doctor</label>
                <input 
                    type="text" 
                    class="todo-app__task-input task"
                >
                <button class="todo-app__button todo-app__button--edit edit">Edit</button>
                <button class="todo-app__button todo-app__button--delete delete">
                    <img src="./remove.svg" alt="remove icon">
                </button>
            </li>
        </ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
